<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3D 迷宮冒險">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <radialGradient id="mz-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7fffd4"/>
      <stop offset="80%" stop-color="#5cd6ff"/>
      <stop offset="100%" stop-color="#5cd6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mz-wall" x1="0" y1="18" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0a1525"/>
    </linearGradient>
  </defs>

  <!-- 深底圓角 -->
  <rect width="32" height="32" rx="6" fill="url(#mz-bg)"/>

  <!-- 第一人稱走廊透視（地板梯形） -->
  <polygon points="6,28 26,28 20,18 12,18" fill="url(#mz-wall)"/>

  <!-- 牆面透視線 -->
  <line x1="6" y1="28" x2="12" y2="18" stroke="#5cd6ff" stroke-opacity="0.45" stroke-width="0.6"/>
  <line x1="26" y1="28" x2="20" y2="18" stroke="#5cd6ff" stroke-opacity="0.45" stroke-width="0.6"/>
  <line x1="12" y1="18" x2="20" y2="18" stroke="#5cd6ff" stroke-opacity="0.6" stroke-width="0.6"/>

  <!-- 中央光球（在走廊盡頭懸浮） -->
  <circle cx="16" cy="14" r="9" fill="url(#mz-orb)" opacity="0.55"/>
  <circle cx="16" cy="14" r="4" fill="#5cd6ff"/>
  <circle cx="14.8" cy="12.8" r="1.4" fill="#ffffff" opacity="0.95"/>

  <!-- 右上 mint 出口指示三角 -->
  <path d="M 22 5 L 27 8 L 22 11 Z" fill="#7fffd4" opacity="0.9"/>

  <!-- 細邊框 -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#5cd6ff" stroke-opacity="0.25" stroke-width="1"/>
</svg>
